name: Provider contracts

on:
  pull_request:
    paths:
      - 'packages/provider-*/**'
      - 'tests/provider-contract/**'
      - '.github/workflows/provider-contract.yml'
  workflow_dispatch:
    inputs:
      live_test:
        description: Request protected live provider tests.
        type: boolean
        default: false
      ttl_minutes:
        description: Maximum resource lifetime. Must be 60 or less.
        type: number
        default: 30

permissions:
  contents: read

jobs:
  simulated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/provider-contract

  live-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.live_test && vars.ENABLE_PROVIDER_LIVE_TESTS == 'true'
    needs: simulated
    runs-on: ubuntu-24.04
    environment: provider-live-tests
    timeout-minutes: 5
    steps:
      - name: Validate cost controls
        env:
          TTL_MINUTES: ${{ inputs.ttl_minutes }}
          CLEANUP_OWNER: ${{ vars.PROVIDER_LIVE_CLEANUP_OWNER }}
        run: |
          test "$TTL_MINUTES" -gt 0
          test "$TTL_MINUTES" -le 60
          test -n "$CLEANUP_OWNER"
      - name: Explain the current gate
        run: >-
          echo "Production provider transports are implemented. This protected preflight does not create a paid resource; an authorized live harness and verified cleanup reconciliation are still required."
