  '@effect/vitest': 4.0.0-rc.111
  '@nuxt/ui': 4.11.0
  '@tanstack/vue-query': 5.102.0
  '@tanstack/vue-table': 9.1.2
  '@types/node': 26.2.0
  effect: 4.0.0-rc.111
  hono: 4.13.3
  nuxt: 4.5.2
  tsdown: 0.22.14
  typescript: 7.0.2
  vite: 8.2.2
  vite-plus: 0.2.9
  vitest: 4.1.11
